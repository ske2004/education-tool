name: Educore Workflow
on: [push]
jobs:
  Test-Linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl-dev ninja-build cmake
      - name: unit tests
        run: python3 build.py test
      - name: build
        run: python3 build.py build
      - name: agent tests
        run: python3 -m unittest discover agents

  MakePkg-Windows:
    name: Build for Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    needs: Test-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7
      - name: checkout
        run: |
          git submodule init
          git submodule update
          git lfs install
          git lfs pull
      - name: build
        run: |
          python3 build.py build -release
          mkdir package
          copy bin\educore.exe package
          move assets package
          cd package
          tar -acf ../educore-windows.zip *
          cd ..
      - name: get version
        id: vars
        run: |
          "version="+(Get-Content -Path .\docs\version).Trim() >> $env:GITHUB_OUTPUT
      - name: release
        uses: actions/create-release@v1
        id: create_release
        with:
          draft: false
          prerelease: true
          release_name: ${{ steps.vars.outputs.version }}.pre-${{ steps.short-sha.outputs.sha }}
          tag_name: ${{ steps.vars.outputs.version }}.${{ steps.short-sha.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: upload windows artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./educore-windows.zip
          asset_name: educore-windows.zip
          asset_content_type: application/zip
