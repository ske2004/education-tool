name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Educore and Showcase
        run: |
          python3 build.py build -release
          python3 scripts/build_demo_showcase.py
          mkdir -p _site
          cp agents/out/showcase.html _site/index.html
          cp agents/out/town.glb _site/town.glb 2>/dev/null || true
          cp agents/out/town.dat _site/town.dat 2>/dev/null || true
          touch _site/.nojekyll

      - name: Install Godot and its export templates
        env:
          GODOT: 4.7.2-stable
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT
          cd "$RUNNER_TEMP"
          curl -sSLO "$base/SHA512-SUMS.txt"
          curl -sSLO "$base/Godot_v${GODOT}_linux.x86_64.zip"
          curl -sSLO "$base/Godot_v${GODOT}_export_templates.tpz"
          grep -E " Godot_v${GODOT}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT}_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT/-/.}"
          mkdir -p "$templates"
          unzip -q "Godot_v${GODOT}_export_templates.tpz"
          mv templates/* "$templates/"

      - name: Export Educore Stories for the web
        run: |
          mkdir -p _site/stories
          godot --headless --path godot --import
          godot --headless --path godot --export-release Web "$PWD/_site/stories/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
